name: Build iOS (IPA non signé)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Choisir la version la plus récente d'Xcode
        run: |
          echo "Versions d'Xcode disponibles :"
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Xcode choisi : $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le projet iOS natif
        run: npx expo prebuild --platform ios

      - name: Compiler (sans signature)
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fabriquer le .ipa
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../DroneControl.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DroneControl-ipa
          path: DroneControl.ipa
